<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first for browsers that take it (it follows the OS colour
         scheme), a PNG for those that do not, and the ICO for whatever
         requests /favicon.ico directly. apple-touch-icon needs declaring:
         iOS only guesses the root path, and not from a subfolder. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#8A2F26" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Harmattan canvas. These must match --color-bg in globals.css, or the
         browser chrome disagrees with the page it is framing. -->
    <meta name="theme-color" content="#D9D5CC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F1D19" media="(prefers-color-scheme: dark)" />
    <title>UrbanPulse · Premium streetwear, cut in Accra</title>
    <meta name="description" content="320gsm ring-spun cotton, cut in Accra. Heavyweight tees, technical outerwear and accessories built to outlast the season." />
    <!-- Static default OG tags. Link-preview crawlers like WhatsApp's do not
         execute JS, so they never see the per-page tags SEO.jsx injects via
         react-helmet. These are the ONLY tags a crawler observes, on every
         URL, until something server-side injects per-page tags before the
         bundle loads. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UrbanPulse" />
    <meta property="og:title" content="UrbanPulse · Premium streetwear, cut in Accra" />
    <meta property="og:description" content="320gsm ring-spun cotton, cut in Accra. Built to outlast the season." />
    <meta property="og:url" content="https://urbanpulsee.vercel.app/" />
    <meta property="og:image" content="https://urbanpulsee.vercel.app/hero/drop-ending.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="716" />
    <meta property="og:image:alt" content="Heavy bone cotton cloth at rest on a dusty concrete floor in raking light." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UrbanPulse · Premium streetwear, cut in Accra" />
    <meta name="twitter:description" content="320gsm ring-spun cotton, cut in Accra. Built to outlast the season." />
    <meta name="twitter:image" content="https://urbanpulsee.vercel.app/hero/drop-ending.jpg" />
    <!-- The hero's first painted pixel: the scrub poster on desktop, the same
         frame as the static hero's background on phones. Matches HERO.poster
         in Home.jsx exactly, and is only preloaded on the homepage. A static
         tag here preloaded it on every route (and was still pointing at the
         previous hero's poster, 70KB nobody saw). -->
    <script>
      if (location.pathname === '/') {
        var pl = document.createElement('link');
        pl.rel = 'preload'; pl.as = 'image'; pl.href = '/hero/journey-poster.jpg';
        pl.setAttribute('fetchpriority', 'high');
        document.head.appendChild(pl);
      }
    </script>
    <!-- Fonts are self-hosted (src/styles/fonts.css, clash.css), so there are
         no font servers to connect to. The splash wordmark's face is fetched
         early, since it's the first text anyone sees. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/clash/clash-display-700.woff2" crossorigin />
    <!-- No-FOUC: applies the stored theme BEFORE React mounts, falling back to
         the OS preference when nothing has been chosen yet. Also marks splash
         start time and arms a failsafe in case React never mounts. -->
    <script>
      (function () {
        function prefersDark() {
          return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        }
        var t;
        try {
          var stored = localStorage.getItem('urbanpulse-theme');
          t = stored || (prefersDark() ? 'dark' : 'light');
        } catch (e) {
          t = prefersDark() ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = t;

        window.__splashStart = Date.now();
        window.__splashTimeoutId = setTimeout(function () {
          var splash = document.getElementById('splash');
          if (!splash) return;
          var msg = document.createElement('p');
          msg.className = 'sp-failsafe';
          msg.innerHTML = 'Taking longer than usual. <a href="">Refresh</a>.';
          splash.appendChild(msg);
        }, 10000);
      })();
    </script>
    <style>
      /* The splash is the first thing anyone sees, so its colours are the
         Harmattan tokens verbatim. They cannot read from globals.css because
         that stylesheet has not loaded yet, so if --color-bg, --color-text or
         --color-accent-text ever change, change them here too. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #D9D5CC; pointer-events: none;
        opacity: 1; transition: opacity .25s ease;
      }
      html.dark #splash { background: #1F1D19; }
      #splash.splash-exit { opacity: 0; }

      .sp-wm {
        display: flex;
        font-family: 'Clash Display', ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 700; letter-spacing: -.03em;
      }
      @keyframes sp-up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      .sp-l, .sp-a {
        opacity: 0;
        animation: sp-up .4s cubic-bezier(.16,1,.3,1) forwards;
        animation-delay: calc(var(--i) * 35ms);
      }
      .sp-l { color: #191713 }
      .sp-a { color: #8A2F26 }
      html.dark .sp-l { color: #EDE8DC }
      html.dark .sp-a { color: #DE6E64 }

      /* A quiet drawn rule rather than a pulsing wordmark: the site's section
         heads open on exactly this gesture, so the splash rehearses it. */
      .sp-rule {
        width: clamp(120px, 30vw, 220px); height: 1px; background: #7C7668;
        transform: scaleX(0); transform-origin: left;
        animation: sp-draw 1.1s cubic-bezier(.16,1,.3,1) .42s forwards;
      }
      html.dark .sp-rule { background: #726C5E }
      @keyframes sp-draw { to { transform: scaleX(1) } }

      .sp-failsafe {
        pointer-events: auto; margin: 0;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: .6875rem; letter-spacing: .16em; text-transform: uppercase;
        color: #57534A;
      }
      html.dark .sp-failsafe { color: #9C968A }
      .sp-failsafe a { color: #8A2F26; text-decoration: underline; text-underline-offset: 3px }
      html.dark .sp-failsafe a { color: #DE6E64 }

      @media (prefers-reduced-motion: reduce) {
        .sp-l, .sp-a { opacity: 1; animation: none }
        .sp-rule { transform: scaleX(1); animation: none }
        #splash { transition: none }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="sp-wm">
        <span class="sp-l" style="--i:0">u</span><span class="sp-l" style="--i:1">r</span><span class="sp-l" style="--i:2">b</span><span class="sp-l" style="--i:3">a</span><span class="sp-l" style="--i:4">n</span><span class="sp-a" style="--i:5">p</span><span class="sp-a" style="--i:6">u</span><span class="sp-a" style="--i:7">l</span><span class="sp-a" style="--i:8">s</span><span class="sp-a" style="--i:9">e</span>
      </div>
      <span class="sp-rule"></span>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
