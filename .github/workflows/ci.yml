# Lints, tests and builds the storefront on every pull request and every
# push to master, and once a day: the test checks src/lib/pricing.js still
# matches the backend's, which can change without a storefront pull request.
# Nothing here deploys; Vercel deploys master as before.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install, as Vercel does, not npm ci: the lockfile is written on
      # Windows, which can leave out optional packages Linux needs.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
