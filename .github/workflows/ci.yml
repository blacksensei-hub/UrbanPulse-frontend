# Builds the storefront on every pull request and every push to master.
# Nothing here deploys; Vercel deploys master as before.
#
# Lint isn't run: ESLint is installed but has no config yet.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install, as Vercel does, not npm ci: the lockfile is written on
      # Windows, which can leave out optional packages Linux needs.
      - run: npm install --no-audit --no-fund
      - run: npm run build
