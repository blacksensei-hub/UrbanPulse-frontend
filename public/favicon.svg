<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Harmattan. These mirror --color-bg and --color-accent in globals.css;
       an SVG favicon cannot read them, so they are copied deliberately. -->
  <style>
    .bg   { fill: #D9D5CC; }
    .mark { fill: #8A2F26; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #1F1D19; }
      .mark { fill: #DE6E64; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14" />
  <!-- A heavier U than before. The old stroke was 8 units wide and turned to
       mush at 16px, which is the size that actually matters in a tab strip. -->
  <path class="mark"
        d="M17 14h10v23c0 4.2 2.2 6.6 5 6.6s5-2.4 5-6.6V14h10v23.4
           C47 46.6 40.6 52 32 52s-15-5.4-15-14.6V14z" />
</svg>
